<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>PBX Elite — Dashboard</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:#000;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;justify-content:center;padding:calc(env(safe-area-inset-top) + 40px) 20px calc(env(safe-area-inset-bottom) + 32px)}
main{width:100%;max-width:560px}
.logo{font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
h1{font-size:34px;line-height:1.1;letter-spacing:-.03em;margin:14px 0 12px;font-weight:800}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid #e5e5ea;border-radius:999px;font-size:14px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:#bbb}
.dot.on{background:#000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}
.stat{border:1px solid #e5e5ea;border-radius:18px;padding:16px}
.stat small{display:block;font-size:12px;font-weight:600;color:#6c6c70;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.stat b{font-size:18px;word-break:break-all}
h2{font-size:20px;margin:30px 0 12px;letter-spacing:-.02em}
input{width:100%;font:inherit;font-size:16px;padding:13px 15px;border:1.5px solid #d1d1d6;border-radius:14px;background:#fff;color:#000;outline:none;margin-bottom:12px}
input:focus{border-color:#000}
details{border:1px solid #e5e5ea;border-radius:16px;padding:0 16px;margin-bottom:10px}
summary{cursor:pointer;list-style:none;padding:15px 0;font-weight:700;font-size:16px;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary span{color:#8e8e93;font-weight:600}
.cmds{padding:0 0 14px;margin:0;list-style:none}
.cmds li{padding:7px 0;border-top:1px solid #f2f2f7;font-size:14px;line-height:1.4;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-word}
.note{margin-top:28px;padding:16px;border-radius:16px;background:#f2f2f7;font-size:14px;line-height:1.5}
.links{display:flex;justify-content:center;gap:10px;margin-top:26px}.links a{color:#000;text-decoration:none;font-weight:600;font-size:14px;padding:9px 16px;border:1px solid #e5e5ea;border-radius:999px}.foot{margin-top:28px;text-align:center;font-size:12px;color:#8e8e93}
</style>
</head>
<body>
<main>
  <div class="logo">PBX Elite</div>
  <h1>Your userbot is live</h1>
  <div class="pill"><span class="dot" id="dot"></span><span id="state">Checking…</span></div>

  <div class="grid">
    <div class="stat"><small>Number</small><b id="number">—</b></div>
    <div class="stat"><small>Name</small><b id="name">—</b></div>
    <div class="stat"><small>Uptime</small><b id="uptime">—</b></div>
    <div class="stat"><small>Prefix</small><b id="prefix">—</b></div>
    <div class="stat"><small>Commands</small><b id="cmds">—</b></div>
    <div class="stat"><small>Version</small><b id="ver">—</b></div>
  </div>

  <div class="note">Open any WhatsApp chat and send <b id="hintPrefix">.</b>menu — or <b id="hintPrefix2">.</b>ping to test. Only one session can be linked to this bot.</div>

  <h2>Commands</h2>
  <input id="q" type="search" placeholder="Search commands…">
  <div id="groups"></div>

  <div class="links"><a href="https://t.me/PBX_UPDATE" target="_blank" rel="noopener">Updates</a><a href="https://t.me/PBXCHATS" target="_blank" rel="noopener">Support</a><a href="https://t.me/BADMUNDAXD" target="_blank" rel="noopener">Owner</a></div>
  <div class="foot">Powered by PBX</div>
</main>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var groups=[];

  function render(filter){
    var box=$("groups");box.textContent="";
    var f=(filter||"").toLowerCase();
    groups.forEach(function(g){
      var list=(g.cmds||[]).filter(function(c){return !f||c.toLowerCase().indexOf(f)>-1||g.title.toLowerCase().indexOf(f)>-1});
      if(!list.length)return;
      var d=document.createElement("details");if(f)d.open=true;
      var s=document.createElement("summary");
      var t=document.createElement("div");t.textContent=g.icon+" "+g.title.toUpperCase();
      var n=document.createElement("span");n.textContent=list.length;
      s.appendChild(t);s.appendChild(n);d.appendChild(s);
      var ul=document.createElement("ul");ul.className="cmds";
      list.forEach(function(c){var li=document.createElement("li");li.textContent=c;ul.appendChild(li)});
      d.appendChild(ul);box.appendChild(d);
    });
  }

  function load(first){
    fetch("/api/status",{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){
      if(!j.paired){location.reload();return}
      $("dot").className="dot"+(j.connected?" on":"");
      $("state").textContent=j.connected?"Online":"Connecting…";
      $("number").textContent="+"+j.number;
      $("name").textContent=j.name||"—";
      $("uptime").textContent=j.uptime;
      $("prefix").textContent=j.prefix;
      $("cmds").textContent=j.commands;
      $("ver").textContent="v"+j.version;
      $("hintPrefix").textContent=j.prefix;$("hintPrefix2").textContent=j.prefix;
      if(first&&j.groups){groups=j.groups;render("")}
    }).catch(function(){$("state").textContent="Offline"});
  }
  $("q").oninput=function(){render(this.value)};
  load(true);setInterval(function(){load(false)},5000);
})();
</script>
</body>
</html>
